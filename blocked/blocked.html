<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked by FocusTabs</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <img src="../icons/icon48.png" alt="" width="48" height="48">
    <h1 id="heading">This site is blocked while you focus</h1>
    <p id="remaining" class="timer" role="timer" aria-label="Time remaining">--:--</p>
    <p id="line"></p>
    <button id="end" type="button">End focus session</button>
  </main>

  <script src="../lib/browser-polyfill.js"></script>
  <script src="../lib/util.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
